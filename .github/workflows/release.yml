name: Release
permissions:
  contents: write

on:
  release:
    types: [published]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run pylint
        run: pylint custom_components/hungaromet_weather_and_forecast/

      - name: Run pytest with coverage
        run: pytest --cov

      - name: Update manifest version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" custom_components/hungaromet_weather_and_forecast/manifest.json

      - name: Create release zip
        # Without the bytecode the tests compiled
        run: |
          cd custom_components
          zip -r ../hungaromet_weather_and_forecast.zip hungaromet_weather_and_forecast -x "*/__pycache__/*"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: hungaromet_weather_and_forecast.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
