name: Release

on:
  release:
    types: [published]

permissions: {}

jobs:
  # The same checks as on main: pylint, tests with coverage
  tests:
    name: "Tests"
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    name: "Release"
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update manifest version
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/\"version\": \".*\"/\"version\": \"$VERSION\"/" custom_components/hungaromet_weather_and_forecast/manifest.json

      - name: Create release zip
        run: |
          cd custom_components
          zip -r ../hungaromet_weather_and_forecast.zip hungaromet_weather_and_forecast -x "*/__pycache__/*"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: hungaromet_weather_and_forecast.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
