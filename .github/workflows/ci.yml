name: CI

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pylint
        run: pylint custom_components/hungaromet_weather_and_forecast/

      - name: Run pytest with coverage
        run: pytest --cov=custom_components/hungaromet_weather_and_forecast --cov-report=term-missing --cov-fail-under=99
