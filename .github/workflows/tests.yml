name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Can be run by other workflows, e.g. before a release
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    name: "Pytest"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v7

      # The Python version the latest Home Assistant requires, e.g. 3.14 from
      # ">=3.14.2"
      - name: Find Home Assistant's Python version
        id: ha-python
        run: |
          REQUIRES=$(curl -fsSL https://pypi.org/pypi/homeassistant/json | jq -r '.info.requires_python')
          VERSION=$(echo "$REQUIRES" | grep -oE '[0-9]+\.[0-9]+' | head -n 1)
          echo "Home Assistant requires Python $REQUIRES: using $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.ha-python.outputs.version }}
          cache: "pip"
          cache-dependency-path: requirements_test.txt

      - name: Install dependencies
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Run pylint
        run: python -m pylint custom_components tests

      # Run the tests even if pylint failed, so both results are visible.
      - name: Run tests with coverage
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest
