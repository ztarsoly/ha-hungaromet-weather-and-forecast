# Settings of the test and check tools; the packages are in requirements_test.txt

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov --cov-report=term-missing"
filterwarnings = [
    "ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning",
]

[tool.coverage.run]
source = ["custom_components"]

[tool.coverage.report]
# Fail the test run if new code isn't covered by tests.
fail_under = 99

[tool.pylint.main]
py-version = "3.14"

[tool.pylint."messages control"]
disable = [
  # Home Assistant entities combine several base classes and have few
  # public methods by design.
  "too-few-public-methods",
  "too-many-ancestors",
  # Entities implement the async variants (async_turn_on, ...); the sync
  # methods pylint reports are only fallbacks in the base classes.
  "abstract-method",
  # Home Assistant callbacks must accept arguments they don't use, and pytest
  # fixtures are often requested only for their side effects.
  "unused-argument",
  # pytest injects fixtures by parameter name, so test functions take many
  # arguments that share names with the fixture functions.
  "redefined-outer-name",
  "too-many-arguments",
  "too-many-positional-arguments",
]
